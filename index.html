<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Esto faltaba en la página envoltorio: sin esto, el celular renderiza
       todo a "ancho de escritorio" y después lo achica con zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Escuela de Cueca</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #EAF0FB; /* mismo celeste de fondo de la app, para que no se note un flash blanco mientras carga */
    }
    #contenedorIframe {
      position: fixed;
      inset: 0;
      height: 100%;
      /* Fallback para Safari/iOS: ahí 100% a veces no calcula bien el
         alto real disponible (por la barra de direcciones que aparece
         y desaparece al scrollear). */
      height: -webkit-fill-available;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #btnPantallaCompleta {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: #2E5AAC;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
  </style>
</head>
<body>

  <div id="contenedorIframe">
    <iframe
      id="miIframe"
      src="https://script.google.com/macros/s/AKfycbzOxP9M_hcRD4I7rsm0P80AmbXIkeXRGmYFVQKlpym40DAFvPn0TkZ_JepPTeYarTA8RA/exec"
      allowfullscreen
      allow="fullscreen"
    ></iframe>
  </div>
  <script>
    function entrarPantallaCompleta() {
      const iframe = document.getElementById('miIframe');
      const solicitar = iframe.requestFullscreen || iframe.webkitRequestFullscreen || iframe.msRequestFullscreen;

      if (!solicitar) {
        // Pasa sobre todo en navegadores embebidos (in-app de Instagram,
        // WhatsApp, etc.) y en versiones viejas de iOS Safari, que no
        // soportan la Fullscreen API para elementos que no sean <video>.
        alert('Este navegador no permite pantalla completa acá — igual la página se ve completa en la pantalla, solo que con la barra del navegador visible.');
        return;
      }

      solicitar.call(iframe)
        .then(() => { document.getElementById('btnPantallaCompleta').style.display = 'none'; })
        .catch(err => console.error('Error al activar pantalla completa: ' + err.message));
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.getElementById('btnPantallaCompleta').style.display = 'block';
      }
    });
  </script>

</body>
</html>
